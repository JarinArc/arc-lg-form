# Cloudflare Pages reads this file automatically on every deploy — no
# dashboard clicking needed for the settings defined here. This exists
# specifically to work around a bug in Cloudflare's dashboard where saving
# an R2 binding through Settings > Bindings doesn't persist.
#
# EDIT THE TWO VALUES BELOW before pushing:
#   1. bucket_name  -> the exact name you gave your R2 bucket
#   2. PUBLIC_R2_URL -> the pub-xxxxxxxx.r2.dev URL from that bucket's
#      public access settings

name = "arc-audience-package-form"
compatibility_date = "2026-09-08"
pages_build_output_dir = "./dist"

[[r2_buckets]]
binding = "SUBMISSIONS_BUCKET"
bucket_name = "arc-lg-form-submissions"

[vars]
PUBLIC_R2_URL = "https://pub-d78690d27c7c47a883a0ed8afd88b64d.r2.dev"
